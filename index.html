<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7Б • Классный портал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #059669;
    --primary-dark: #047857;
    --primary-light: #10b981;
    --primary-glow: rgba(5, 150, 105, .25);
    --accent: #f59e0b;
    --accent-2: #8b5cf6;
    --accent-3: #ec4899;
    --bg: #f0fdf4;
    --bg-2: #ecfdf5;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #d1fae5;
    --danger: #ef4444;
    --success: #10b981;
    --gold-1: #fbbf24;
    --gold-2: #f59e0b;
    --gold-3: #d97706;
    --radius: 16px;
    --shadow: 0 8px 24px rgba(5, 150, 105, .08);
    --shadow-lg: 0 20px 60px rgba(5, 150, 105, .15);
    --input-bg: #f8fffe;
    --font-head: 'Fredoka', 'Nunito', sans-serif;
    --font-body: 'Nunito', system-ui, sans-serif;
  }
  body.dark {
    --primary: #10b981;
    --primary-dark: #34d399;
    --primary-light: #6ee7b7;
    --primary-glow: rgba(16, 185, 129, .3);
    --bg: #0a1612;
    --bg-2: #0f1e1a;
    --card: #14261f;
    --text: #ecfdf5;
    --muted: #86a89b;
    --border: #1e3a32;
    --input-bg: #0f1e1a;
    --shadow: 0 8px 24px rgba(0, 0, 0, .4);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, .6);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-body);
    background: var(--bg); color: var(--text);
    font-size: 17px; line-height: 1.55;
    min-height: 100vh;
    transition: background .4s, color .4s;
    overflow-x: hidden;
  }
  h1, h2, h3, h4, .logo, .day-title, .pomo-time { font-family: var(--font-head); letter-spacing: .3px; }

  body.disco { animation: discoBg 1s linear infinite; }
  @keyframes discoBg {
    0%   { background: #ff0080; } 25%  { background: #00ff80; }
    50%  { background: #8000ff; } 75%  { background: #ff8000; }
    100% { background: #ff0080; }
  }
  body.disco header { animation: discoBg .5s linear infinite; }

  #scroll-progress {
    position: fixed; top: 0; left: 0; height: 3px; width: 0%;
    background: linear-gradient(90deg, var(--primary), var(--accent), var(--accent-2), var(--primary));
    background-size: 200% 100%; animation: gradientMove 3s linear infinite;
    z-index: 9999; transition: width .1s linear; box-shadow: 0 0 12px var(--primary-glow);
  }
  @keyframes gradientMove { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

  .blob {
    position: fixed; border-radius: 50%; filter: blur(80px); opacity: .35;
    z-index: 0; pointer-events: none; animation: blobFloat 20s ease-in-out infinite;
  }
  .blob-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; }
  .blob-2 { width: 300px; height: 300px; background: var(--accent); bottom: -50px; right: -80px; animation-delay: -7s; }
  .blob-3 { width: 250px; height: 250px; background: var(--accent-2); top: 40%; right: 20%; animation-delay: -14s; opacity: .15; }
  @keyframes blobFloat {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(60px, -40px) scale(1.1); }
    66% { transform: translate(-40px, 50px) scale(.9); }
  }

  #particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .particle { position: absolute; opacity: .35; animation: floatParticle linear infinite; color: var(--primary); }
  @keyframes floatParticle { from { transform: translateY(100vh) rotate(0deg); } to { transform: translateY(-100px) rotate(360deg); } }

  /* AUTH */
  .auth-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; z-index: 2;
    background:
      radial-gradient(circle at 10% 20%, rgba(16,185,129,.15) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(245,158,11,.12) 0%, transparent 40%);
  }
  .auth-card {
    background: var(--card); border-radius: 24px;
    padding: 40px 36px; width: 100%; max-width: 460px;
    box-shadow: var(--shadow-lg); animation: rise .6s ease;
    border: 1px solid var(--border); position: relative; overflow: hidden;
  }
  .auth-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--accent), var(--accent-2));
    background-size: 200% 100%; animation: gradientMove 3s linear infinite;
  }
  .auth-logo { text-align: center; margin-bottom: 24px; }
  .auth-logo .logo-icon { font-size: 56px; color: var(--primary); display: inline-block; animation: spinPulse 4s ease infinite; }
  @keyframes spinPulse { 0%,100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.1) rotate(-8deg); } }
  .auth-logo h1 {
    font-size: 52px; margin-top: 8px; letter-spacing: 2px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light), var(--accent));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% 200%; animation: gradientMove 4s ease infinite;
  }
  .auth-logo p { color: var(--muted); font-size: 15px; }
  .auth-form h2 { font-size: 22px; margin-bottom: 16px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .auth-form h2 i { color: var(--primary); }
  .auth-form label { display: block; font-size: 15px; font-weight: 600; margin: 12px 0 6px; }
  .auth-form .req { color: var(--danger); }
  .auth-form input, .textarea, .modal-card input, .modal-card textarea {
    width: 100%; padding: 13px 16px; font-size: 16px;
    border: 2px solid var(--border); border-radius: 12px;
    background: var(--input-bg); color: var(--text);
    font-family: inherit; transition: border-color .2s, box-shadow .2s;
  }
  .auth-form input:focus, .textarea:focus, .modal-card input:focus, .modal-card textarea:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow);
  }
  .textarea { resize: vertical; min-height: 90px; }

  .avatar-picker { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 6px; }
  .avatar-opt {
    aspect-ratio: 1; border-radius: 10px;
    border: 2px solid var(--border); background: var(--bg-2);
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; transition: all .2s;
  }
  .avatar-opt:hover { border-color: var(--primary); color: var(--primary); transform: scale(1.1); }
  .avatar-opt.selected {
    border-color: var(--primary); color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    transform: scale(1.1); box-shadow: 0 4px 12px var(--primary-glow);
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 12px 20px; font-size: 16px;
    font-family: var(--font-head); font-weight: 600;
    border: 2px solid var(--border); background: var(--card);
    color: var(--text); border-radius: 12px; cursor: pointer;
    transition: transform .15s, background .2s, box-shadow .2s, border-color .2s, color .2s;
    position: relative; overflow: hidden;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    background-size: 200% 200%; border-color: transparent; color: #fff;
    width: 100%; margin-top: 20px; box-shadow: 0 6px 18px var(--primary-glow);
  }
  .btn-primary:hover { background-position: 100% 0; box-shadow: 0 12px 28px var(--primary-glow); }
  .btn-danger { background: var(--danger); color: #fff; border-color: transparent; }
  .btn-small { padding: 8px 14px; font-size: 14px; width: auto; margin: 0; }
  .btn-gold {
    background: linear-gradient(135deg, var(--gold-1), var(--gold-3));
    background-size: 200% 200%; border-color: transparent; color: #fff;
    box-shadow: 0 6px 18px rgba(245,158,11,.4);
  }
  .btn-gold:hover { background-position: 100% 0; box-shadow: 0 12px 28px rgba(245,158,11,.6); }

  .auth-switch { text-align: center; margin-top: 14px; font-size: 15px; color: var(--muted); }
  .auth-switch a { color: var(--primary); cursor: pointer; font-weight: 600; }
  .auth-switch a:hover { text-decoration: underline; }
  .auth-error { color: var(--danger); font-size: 14px; text-align: center; margin-top: 8px; min-height: 20px; }

  /* HEADER */
  #app { min-height: 100vh; position: relative; z-index: 2; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 32px; background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(10px);
    box-shadow: 0 2px 12px rgba(5,150,105,.05);
    transition: background .4s;
  }
  header::after {
    content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary), var(--accent), var(--primary), transparent);
    background-size: 200% 100%; animation: gradientMove 4s linear infinite;
  }
  .logo {
    display: flex; align-items: center; gap: 12px;
    font-size: 28px; font-weight: 700; letter-spacing: 1px;
    color: var(--primary); cursor: pointer; user-select: none;
    transition: transform .2s;
  }
  .logo:hover { transform: scale(1.05) rotate(-2deg); }
  .logo i { font-size: 32px; animation: leafWiggle 3s ease infinite; }
  @keyframes leafWiggle { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
  .user-info { display: flex; align-items: center; gap: 12px; font-size: 16px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    background-size: 200% 200%;
    animation: crownGlow 2s ease infinite, gradientMove 3s ease infinite;
    color: #78350f; font-size: 13px; font-weight: 800;
    padding: 5px 12px; border-radius: 20px;
    font-family: var(--font-head);
  }
  @keyframes crownGlow {
    0%,100% { box-shadow: 0 2px 8px rgba(245,158,11,.4); }
    50% { box-shadow: 0 4px 20px rgba(245,158,11,.8); }
  }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 12px;
    border: 2px solid var(--border); background: var(--card);
    color: var(--text); font-size: 16px; cursor: pointer;
    transition: all .25s; display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .icon-btn:hover {
    border-color: var(--primary); color: var(--primary);
    transform: rotate(-10deg) scale(1.08); box-shadow: 0 6px 18px var(--primary-glow);
  }
  .icon-btn .dot {
    position: absolute; top: -4px; right: -4px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--danger); border: 2px solid var(--card);
    display: none;
  }
  .icon-btn.has-new .dot { display: block; animation: pop 1s ease infinite; }
  .icon-btn.syncing i { animation: spin360 1s linear infinite; }
  .icon-btn.online { border-color: var(--success); }
  .icon-btn.offline { border-color: var(--danger); }
  .icon-btn.online i { color: var(--success); }
  .icon-btn.offline i { color: var(--danger); }

  .profile-chip {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 14px 6px 6px;
    background: var(--bg-2); border-radius: 30px;
    border: 2px solid transparent; cursor: pointer;
    transition: all .25s; position: relative;
  }
  .profile-chip:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow); }
  .profile-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    box-shadow: 0 4px 12px var(--primary-glow);
  }
  .profile-avatar.owner {
    background: linear-gradient(135deg, var(--gold-1), var(--gold-3));
    box-shadow: 0 4px 16px rgba(245,158,11,.6), 0 0 0 2px var(--gold-1);
    animation: crownGlow 2s ease infinite;
  }
  .profile-info { display: flex; flex-direction: column; line-height: 1.1; }
  .profile-name { font-size: 15px; font-weight: 700; font-family: var(--font-head); }
  .profile-level { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .xp-bar-mini { width: 60px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 2px; }
  .xp-bar-mini > div { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width .4s; }

  .profile-menu {
    position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px;
    box-shadow: var(--shadow-lg); width: 300px;
    z-index: 100; display: none; animation: rise .25s ease;
  }
  .profile-menu.open { display: block; }
  .profile-menu h4 { font-family: var(--font-head); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .profile-menu .stat-row {
    display: flex; justify-content: space-between;
    padding: 6px 0; font-size: 14px;
    border-bottom: 1px dashed var(--border);
  }
  .profile-menu .stat-row:last-of-type { border-bottom: none; }
  .profile-menu .stat-row b { color: var(--primary); }
  .profile-menu .avatar-change { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 12px; }
  .profile-menu .avatar-change .avatar-opt { font-size: 14px; }

  /* TABS */
  .tabs { display: flex; gap: 8px; padding: 14px 32px 0; flex-wrap: wrap; }
  .tab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; font-size: 15px; font-weight: 700;
    font-family: var(--font-head); border: 2px solid transparent;
    background: var(--card); color: var(--muted);
    border-radius: 12px; cursor: pointer;
    transition: all .25s; position: relative;
  }
  .tab:hover { color: var(--primary); transform: translateY(-3px); box-shadow: var(--shadow); }
  .tab.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    background-size: 200% 200%; color: #fff;
    box-shadow: 0 6px 20px var(--primary-glow);
    transform: translateY(-2px); animation: gradientMove 5s ease infinite;
  }
  .tab.active i { animation: iconBounce .5s ease; }
  .tab .tab-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--danger); position: absolute;
    top: 6px; right: 6px; display: none;
  }
  .tab.has-new .tab-dot { display: block; animation: pop 1s ease infinite; }
  @keyframes iconBounce {
    0% { transform: scale(0) rotate(-180deg); }
    60% { transform: scale(1.3) rotate(20deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  main { padding: 20px 32px 100px; max-width: 1200px; margin: 0 auto; }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeUp .4s ease; }

  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .section-head h2 { font-size: 26px; display: flex; align-items: center; gap: 10px; }
  .section-head h2 i { color: var(--primary); animation: iconFloat 3s ease infinite; }
  @keyframes iconFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: transform .25s, box-shadow .25s, border-color .25s;
    animation: fadeUp .4s ease both;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    background-size: 200% 100%; animation: gradientMove 3s linear infinite;
    transform: scaleX(0); transform-origin: left; transition: transform .4s;
  }
  .card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--primary-light); }
  .card:hover::before { transform: scaleX(1); }
  .card .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .card .card-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(16,185,129,.15), rgba(5,150,105,.25));
    color: var(--primary); font-size: 20px; flex-shrink: 0;
    transition: transform .3s;
  }
  .card:hover .card-icon { transform: rotate(-10deg) scale(1.15); }
  .card h3 { font-size: 18px; line-height: 1.3; }
  .card .date { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .card p { color: var(--text); font-size: 16px; opacity: .85; }
  .card .card-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  .mini-btn {
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 15px; padding: 6px 10px;
    border-radius: 8px; transition: all .2s; font-family: inherit;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .mini-btn:hover { background: var(--bg-2); color: var(--primary); }
  .mini-btn.danger:hover { background: rgba(239,68,68,.1); color: var(--danger); }

  .reactions {
    display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap;
    border-top: 1px dashed var(--border); padding-top: 12px;
  }
  .react-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 20px;
    background: var(--bg-2); border: 2px solid transparent;
    cursor: pointer; font-size: 14px; font-weight: 700;
    color: var(--muted); transition: all .2s;
    font-family: var(--font-head);
  }
  .react-btn:hover { border-color: var(--primary); transform: scale(1.08); }
  .react-btn i { font-size: 15px; }
  .react-btn.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border-color: transparent;
  }
  .react-btn.active i { animation: pop .4s ease; }

  .widgets-row {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    margin-bottom: 20px;
  }
  .widget {
    background: var(--card); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
    border: 1px solid var(--border);
    animation: fadeUp .4s ease both;
    position: relative; overflow: hidden;
  }
  .widget h3 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; color: var(--primary); }
  .widget.quote-widget { background: linear-gradient(135deg, rgba(16,185,129,.08), rgba(245,158,11,.08)); }
  .widget .quote-text { font-style: italic; font-size: 16px; }
  .widget .quote-author { font-size: 13px; color: var(--muted); margin-top: 8px; text-align: right; }
  .poll-option {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; margin-bottom: 6px;
    background: var(--bg-2); border-radius: 10px;
    cursor: pointer; transition: all .2s;
    border: 2px solid transparent;
    position: relative; overflow: hidden;
  }
  .poll-option:hover { border-color: var(--primary); transform: translateX(4px); }
  .poll-option.voted { border-color: var(--primary); background: rgba(16,185,129,.1); cursor: default; }
  .poll-option .poll-fill {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, rgba(16,185,129,.2), rgba(16,185,129,.35));
    transition: width .5s ease; z-index: 0; border-radius: 10px;
  }
  .poll-option > * { position: relative; z-index: 1; }
  .poll-label { font-weight: 600; font-size: 14px; }
  .poll-count { font-size: 13px; color: var(--muted); font-weight: 700; }

  .day-card .day-title {
    font-size: 19px; font-weight: 600; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .day-title .day-name { display: flex; align-items: center; gap: 10px; }
  .day-title i { color: var(--primary); }
  .lesson-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .lesson-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: var(--bg-2);
    border-radius: 10px; font-size: 16px;
    transition: background .25s, transform .25s;
  }
  .lesson-item:hover { background: rgba(16,185,129,.15); transform: translateX(5px); }
  .lesson-num {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; flex-shrink: 0;
    font-family: var(--font-head);
  }

  .hw-item {
    background: var(--bg-2); border-left: 4px solid var(--accent);
    border-radius: 10px; padding: 12px 14px;
    margin-bottom: 8px; font-size: 15px;
    transition: transform .2s, box-shadow .2s;
  }
  .hw-item:hover { transform: translateX(5px); box-shadow: 0 4px 12px rgba(245,158,11,.15); }
  .hw-item .hw-subject {
    font-weight: 800; color: var(--primary);
    font-size: 14px; display: block; margin-bottom: 4px;
    font-family: var(--font-head); letter-spacing: .3px;
  }

  .question-card {
    background: var(--card); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
    border: 1px solid var(--border); margin-bottom: 14px;
    animation: fadeUp .4s ease both;
    transition: transform .2s, box-shadow .2s;
  }
  .question-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .question-card .q-head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .q-author {
    background: linear-gradient(135deg, rgba(16,185,129,.15), rgba(5,150,105,.25));
    color: var(--primary); padding: 4px 12px; border-radius: 20px;
    font-size: 14px; font-weight: 700;
    font-family: var(--font-head);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .q-author.owner {
    background: linear-gradient(135deg, var(--gold-1), var(--gold-3));
    color: #fff; box-shadow: 0 2px 10px rgba(245,158,11,.5);
  }
  .q-author .mini-av {
    width: 20px; height: 20px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px;
  }
  .q-author.owner .mini-av { background: rgba(255,255,255,.3); }
  .question-card .q-time { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
  .question-card .q-text { font-size: 16px; }
  .answer-block {
    margin-top: 10px; padding: 10px 14px;
    background: rgba(16,185,129,.1);
    border-left: 4px solid var(--success);
    border-radius: 8px; font-size: 15px;
    display: flex; gap: 8px;
  }
  .answer-block i { color: var(--success); margin-top: 3px; }

  .games-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .game-card {
    background: var(--card); border-radius: var(--radius);
    padding: 24px 20px; box-shadow: var(--shadow);
    border: 1px solid var(--border); text-align: center; cursor: pointer;
    transition: all .3s cubic-bezier(.34,1.56,.64,1);
    position: relative; overflow: hidden;
  }
  .game-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--primary), var(--accent-2));
    opacity: 0; transition: opacity .3s; z-index: 0;
  }
  .game-card > * { position: relative; z-index: 1; }
  .game-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: var(--shadow-lg); border-color: var(--primary); }
  .game-card:hover::before { opacity: .06; }
  .game-card .game-icon {
    font-size: 48px; margin-bottom: 12px;
    display: inline-block; color: var(--primary);
    animation: iconFloat 3s ease infinite; transition: transform .3s;
  }
  .game-card:hover .game-icon { transform: scale(1.15) rotate(-8deg); color: var(--accent); }
  .game-card h3 { font-size: 18px; margin-bottom: 6px; }
  .game-card p { color: var(--muted); font-size: 14px; }

  .fun-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .fun-card {
    background: var(--card); border-radius: var(--radius);
    padding: 22px 18px; box-shadow: var(--shadow);
    border: 1px solid var(--border); cursor: pointer;
    text-align: center; transition: all .3s cubic-bezier(.34,1.56,.64,1);
    position: relative; overflow: hidden;
  }
  .fun-card:hover { transform: translateY(-6px) rotate(-1deg); box-shadow: var(--shadow-lg); border-color: var(--primary); }
  .fun-card .fun-icon { font-size: 40px; color: var(--primary); margin-bottom: 10px; display: inline-block; transition: transform .3s; }
  .fun-card:hover .fun-icon { transform: scale(1.2) rotate(10deg); }
  .fun-card h4 { font-size: 16px; margin-bottom: 4px; }
  .fun-card p { font-size: 13px; color: var(--muted); }
  .fun-result {
    margin-top: 20px; padding: 24px;
    background: linear-gradient(135deg, rgba(16,185,129,.08), rgba(139,92,246,.08));
    border-radius: var(--radius);
    border: 1px dashed var(--primary-light);
    font-size: 17px; text-align: center;
    animation: rise .35s ease; min-height: 100px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
  }
  .fun-result .fun-result-icon { font-size: 42px; color: var(--accent); }
  .fun-result .fun-result-text { font-family: var(--font-head); font-weight: 600; }

  /* CHAT */
  .chat-wrap {
    display: flex; flex-direction: column;
    height: 65vh; min-height: 400px;
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border); box-shadow: var(--shadow);
    overflow: hidden;
  }
  .chat-head {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, rgba(16,185,129,.05), transparent);
  }
  .chat-head h3 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .chat-head h3 i { color: var(--primary); }
  .online-count {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); font-weight: 700;
    font-family: var(--font-head);
  }
  .online-count .online-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 8px var(--success); animation: pulseDot 2s ease infinite;
  }
  @keyframes pulseDot { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: .6; } }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .chat-msg { display: flex; gap: 10px; animation: fadeUp .3s ease; max-width: 85%; }
  .chat-msg.own { align-self: flex-end; flex-direction: row-reverse; }
  .chat-msg .msg-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0; position: relative;
  }
  .chat-msg.own .msg-avatar { background: linear-gradient(135deg, var(--accent), #ea580c); }
  .chat-msg .msg-avatar.owner {
    background: linear-gradient(135deg, var(--gold-1), var(--gold-3));
    color: #fff;
    box-shadow: 0 0 0 2px var(--gold-1), 0 0 12px rgba(245,158,11,.8), 0 0 24px rgba(245,158,11,.4);
    animation: crownGlow 2s ease infinite;
  }
  .chat-msg .msg-avatar.owner::after {
    content: ''; position: absolute; inset: -4px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--gold-1), var(--gold-3), var(--gold-1), var(--gold-3), var(--gold-1));
    z-index: -1;
    animation: spin360 4s linear infinite;
    filter: blur(2px);
    opacity: .7;
  }
  .chat-msg .msg-body {
    background: var(--bg-2); padding: 9px 14px;
    border-radius: 14px; border-top-left-radius: 4px;
  }
  .chat-msg.own .msg-body {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border-top-left-radius: 14px; border-top-right-radius: 4px;
  }
  .chat-msg.own .msg-author { color: rgba(255,255,255,.85) !important; }
  .chat-msg.own .msg-time { color: rgba(255,255,255,.7) !important; }
  .chat-msg.own .msg-level { background: rgba(255,255,255,.2) !important; color: #fff !important; }
  .chat-msg .msg-author {
    font-size: 12px; font-weight: 700; color: var(--primary);
    margin-bottom: 3px; font-family: var(--font-head);
    display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
  }
  .chat-msg .msg-time { font-size: 11px; color: var(--muted); margin-left: 6px; font-weight: 500; }
  .chat-msg .msg-text { font-size: 15px; word-wrap: break-word; }
  .owner-prefix {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 1px 8px;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-3));
    background-size: 200% 200%;
    animation: gradientMove 2s ease infinite;
    color: #fff; font-size: 10px; font-weight: 800;
    border-radius: 8px; text-transform: uppercase;
    letter-spacing: .5px;
    font-family: var(--font-head);
    box-shadow: 0 0 8px rgba(245,158,11,.6);
  }
  .owner-prefix i { font-size: 10px; }
  .msg-level {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 1px 7px;
    background: var(--bg-2);
    color: var(--primary);
    font-size: 10px; font-weight: 800;
    border-radius: 6px;
    font-family: var(--font-head);
    border: 1px solid var(--border);
  }
  .msg-level i { font-size: 9px; }
  .chat-input-row {
    padding: 12px 16px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; background: var(--card);
  }
  .chat-input-row input {
    flex: 1; padding: 11px 16px;
    border: 2px solid var(--border); border-radius: 22px;
    background: var(--input-bg); color: var(--text);
    font-family: inherit; font-size: 15px;
  }
  .chat-input-row input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
  .chat-send {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border: none; font-size: 16px; cursor: pointer;
    transition: transform .2s;
    display: flex; align-items: center; justify-content: center;
  }
  .chat-send:hover { transform: scale(1.1) rotate(-10deg); }
  .chat-emojis { display: flex; gap: 4px; margin-right: 4px; }
  .chat-emoji-btn {
    width: 36px; height: 36px; border-radius: 8px;
    background: transparent; border: none;
    color: var(--muted); cursor: pointer; font-size: 16px;
    transition: all .2s;
  }
  .chat-emoji-btn:hover { background: var(--bg-2); color: var(--primary); transform: scale(1.15); }

  /* HONOR BOARD */
  .honor-grid {
    display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .honor-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px 20px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 2px solid transparent;
    position: relative; overflow: hidden;
    transition: transform .3s, box-shadow .3s;
    animation: fadeUp .5s ease both;
  }
  .honor-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 20px 50px rgba(245,158,11,.3); }
  .honor-card::before {
    content: ''; position: absolute; inset: -2px;
    background: conic-gradient(from 0deg, var(--gold-1), var(--gold-3), var(--gold-1), var(--gold-3), var(--gold-1));
    z-index: -1; border-radius: var(--radius);
    animation: spin360 6s linear infinite;
    opacity: .8;
  }
  .honor-card::after {
    content: ''; position: absolute; inset: 0;
    background: var(--card); z-index: -1; border-radius: calc(var(--radius) - 2px);
    margin: 2px;
  }
  .honor-shine {
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%);
    animation: shineMove 4s ease-in-out infinite;
    pointer-events: none;
    border-radius: var(--radius);
  }
  @keyframes shineMove {
    0% { transform: translateX(-100%); }
    50%, 100% { transform: translateX(100%); }
  }
  .honor-avatar {
    width: 90px; height: 90px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-3));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 40px; margin: 0 auto 12px;
    box-shadow: 0 8px 20px rgba(245,158,11,.4), 0 0 0 3px rgba(245,158,11,.3);
    position: relative;
    overflow: hidden;
  }
  .honor-avatar img {
    width: 100%; height: 100%; object-fit: cover;
    display: block; border-radius: 50%;
  }
  .honor-avatar::after {
    content: '\f521';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    position: absolute;
    top: -8px; right: -8px;
    font-size: 24px;
    color: var(--gold-2);
    filter: drop-shadow(0 0 6px rgba(245,158,11,.8));
    z-index: 2;
    pointer-events: none;
  }
  .honor-name {
    font-family: var(--font-head);
    font-size: 19px; font-weight: 700;
    margin-bottom: 4px;
    color: var(--text);
  }
  .honor-reason {
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
    line-height: 1.4;
  }
  .honor-date {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .honor-stars {
    color: var(--gold-2);
    font-size: 14px;
    margin-top: 8px;
    letter-spacing: 2px;
  }
  .honor-delete {
    position: absolute; top: 10px; right: 10px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(239,68,68,.15); color: var(--danger);
    border: none; cursor: pointer;
    font-size: 13px;
    display: none;
    align-items: center; justify-content: center;
    z-index: 5;
    transition: all .2s;
  }
  .honor-delete:hover { background: var(--danger); color: #fff; transform: scale(1.15); }
  .honor-card:hover .honor-delete { display: flex; }
  .honor-empty {
    grid-column: 1 / -1;
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
  }
  .honor-empty i {
    font-size: 64px; color: var(--gold-2); display: block;
    margin-bottom: 16px;
    animation: iconFloat 3s ease infinite;
  }
  .honor-photo-preview {
    margin-top: 12px;
    text-align: center;
    display: none;
  }
  .honor-photo-preview img {
    width: 120px; height: 120px; object-fit: cover;
    border-radius: 50%;
    border: 3px solid var(--gold-1);
    box-shadow: 0 8px 20px rgba(245,158,11,.4);
  }
  .honor-file-row {
    display: flex; gap: 10px; align-items: center;
  }
  .honor-file-row input[type=file] {
    flex: 1; padding: 10px 12px; font-size: 14px;
    cursor: pointer;
  }
  .honor-file-row input[type=file]::file-selector-button {
    background: var(--primary); color: #fff; border: none;
    padding: 6px 14px; border-radius: 8px;
    font-family: var(--font-head); font-weight: 600;
    cursor: pointer; margin-right: 10px;
    transition: background .2s;
  }
  .honor-file-row input[type=file]::file-selector-button:hover { background: var(--primary-dark); }

  /* PET */
  .pet-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 800px; margin: 0 auto; }
  .pet-card {
    background: var(--card); border-radius: var(--radius);
    padding: 26px; text-align: center;
    box-shadow: var(--shadow); border: 1px solid var(--border);
    position: relative; overflow: hidden;
  }
  .pet-avatar {
    font-size: 100px; color: var(--primary);
    display: inline-block; margin: 10px 0;
    cursor: pointer; transition: transform .3s;
    animation: petIdle 3s ease-in-out infinite; user-select: none;
  }
  @keyframes petIdle {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }
  .pet-avatar.happy { animation: petHappy .5s ease infinite; }
  @keyframes petHappy {
    0%,100% { transform: scale(1) rotate(-8deg); }
    50% { transform: scale(1.15) rotate(8deg); }
  }
  .pet-avatar.sad { filter: grayscale(.6) brightness(.8); }
  .pet-name {
    font-family: var(--font-head);
    font-size: 22px; font-weight: 700;
    color: var(--primary);
    display: inline-flex; align-items: center; gap: 8px;
    justify-content: center;
  }
  .pet-rename-btn {
    background: transparent; border: none;
    color: var(--muted); font-size: 13px;
    cursor: pointer; padding: 4px 6px; border-radius: 6px;
    transition: all .2s;
  }
  .pet-rename-btn:hover { background: var(--bg-2); color: var(--primary); transform: rotate(-10deg); }
  .pet-stats { margin-top: 16px; text-align: left; }
  .pet-stat { margin-bottom: 10px; }
  .pet-stat-label {
    display: flex; justify-content: space-between;
    font-size: 13px; font-weight: 700;
    font-family: var(--font-head);
    margin-bottom: 4px; color: var(--muted);
  }
  .pet-stat-bar { height: 12px; border-radius: 6px; background: var(--border); overflow: hidden; }
  .pet-stat-bar > div {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    transition: width .4s; border-radius: 6px;
  }
  .pet-stat-bar.hunger > div { background: linear-gradient(90deg, #f59e0b, #ef4444); }
  .pet-stat-bar.mood > div { background: linear-gradient(90deg, #8b5cf6, #ec4899); }
  .pet-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }
  .pet-actions .btn { width: auto; margin: 0; padding: 10px 16px; font-size: 14px; }

  /* ACHIEVEMENTS */
  .ach-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .ach-card {
    background: var(--card); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow);
    border: 1px solid var(--border);
    display: flex; gap: 14px; align-items: center;
    position: relative; overflow: hidden;
    transition: all .25s;
  }
  .ach-card.locked { opacity: .45; filter: grayscale(.7); }
  .ach-card.unlocked { border-color: var(--primary); }
  .ach-card.unlocked::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
  }
  .ach-icon {
    width: 52px; height: 52px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0;
    background: linear-gradient(135deg, rgba(16,185,129,.15), rgba(5,150,105,.25));
    color: var(--primary);
  }
  .ach-card.locked .ach-icon { background: var(--bg-2); color: var(--muted); }
  .ach-info h4 { font-size: 15px; margin-bottom: 3px; }
  .ach-info p { font-size: 13px; color: var(--muted); }

  .doodle-wrap {
    background: var(--card); border-radius: var(--radius);
    padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .doodle-tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .doodle-tools .color-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--border); cursor: pointer; transition: transform .2s;
  }
  .doodle-tools .color-btn:hover { transform: scale(1.15); }
  .doodle-tools .color-btn.active { border-color: var(--text); transform: scale(1.15); }
  .doodle-tools input[type=range] { flex: 1; min-width: 100px; max-width: 150px; accent-color: var(--primary); }
  #doodle-canvas {
    width: 100%; height: 400px; background: #fff;
    border-radius: 12px; border: 2px solid var(--border);
    cursor: crosshair; touch-action: none; display: block;
  }
  body.dark #doodle-canvas { background: #1a1f2e; }

  .modal {
    position: fixed; inset: 0;
    background: rgba(5,20,15,.55);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 100; backdrop-filter: blur(6px);
  }
  .modal.open { display: flex; animation: fadeIn .25s ease; }
  .modal-card {
    background: var(--card); color: var(--text);
    border-radius: 20px; padding: 28px;
    max-width: 560px; width: 100%;
    max-height: 90vh; overflow-y: auto;
    animation: rise .35s cubic-bezier(.34,1.56,.64,1);
    border: 1px solid var(--border); position: relative;
  }
  .modal-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--accent), var(--accent-2));
    background-size: 200% 100%; animation: gradientMove 3s linear infinite;
    border-radius: 20px 20px 0 0;
  }
  .modal-card h3 { font-size: 22px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  .modal-card h3 i { color: var(--primary); }
  .modal-card label { display: block; font-size: 15px; font-weight: 600; margin: 12px 0 6px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; justify-content: flex-end; }
  .modal-actions .btn { width: auto; margin-top: 0; }

  .pomodoro { position: fixed; bottom: 24px; right: 24px; z-index: 80; }
  .pomodoro-btn {
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border: none; font-size: 24px; cursor: pointer;
    box-shadow: 0 8px 24px var(--primary-glow);
    transition: transform .25s;
    animation: pomoPulse 3s ease infinite;
    display: flex; align-items: center; justify-content: center;
  }
  @keyframes pomoPulse {
    0%,100% { box-shadow: 0 8px 24px var(--primary-glow); }
    50% { box-shadow: 0 8px 32px var(--primary-glow), 0 0 0 10px rgba(16,185,129,.08); }
  }
  .pomodoro-btn:hover { transform: scale(1.1) rotate(-10deg); }
  .pomodoro-panel {
    position: absolute; bottom: 74px; right: 0;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px;
    box-shadow: var(--shadow-lg); width: 250px;
    display: none; animation: rise .3s ease;
  }
  .pomodoro-panel.open { display: block; }
  .pomo-time {
    font-size: 40px; font-weight: 700; text-align: center;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    font-variant-numeric: tabular-nums;
    margin-bottom: 12px; letter-spacing: 2px;
  }
  .pomo-controls { display: flex; gap: 8px; justify-content: center; }
  .pomo-controls .btn { width: 46px; height: 46px; padding: 0; font-size: 16px; }

  #scroll-top {
    position: fixed; bottom: 24px; left: 24px;
    width: 46px; height: 46px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #f97316);
    color: #fff; border: none; font-size: 18px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(245,158,11,.4);
    display: none; align-items: center; justify-content: center;
    z-index: 80; transition: transform .25s;
  }
  #scroll-top.show { display: flex; animation: rise .3s ease; }
  #scroll-top:hover { transform: translateY(-5px) scale(1.1); }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 16px; }
  .empty i { font-size: 48px; display: block; margin-bottom: 12px; opacity: .5; color: var(--primary); }
  .empty-inline { padding: 12px; text-align: center; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; }

  @keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes floatUp { from { transform: translateY(100vh) rotate(0deg); opacity: 1; } to { transform: translateY(-20vh) rotate(720deg); opacity: 0; } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px) rotate(-3deg); } 75% { transform: translateX(6px) rotate(3deg); } }
  @keyframes spin360 { to { transform: rotate(360deg); } }

  .easter-float { position: fixed; bottom: -80px; font-size: 40px; pointer-events: none; animation: floatUp 4s linear forwards; z-index: 999; }
  .easter-float i { color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); }
  .emoji-burst { position: fixed; font-size: 32px; pointer-events: none; z-index: 999; animation: burstOut .8s ease-out forwards; }
  @keyframes burstOut {
    from { transform: translate(-50%,-50%) scale(.5); opacity: 1; }
    to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4); opacity: 0; }
  }
  .walking-cat { position: fixed; bottom: 20px; font-size: 48px; z-index: 200; pointer-events: none; animation: walkAcross 8s linear forwards; color: var(--accent); }
  @keyframes walkAcross { from { left: -80px; } to { left: 100vw; } }
  .secret-star {
    position: fixed; width: 58px; height: 58px; border-radius: 50%;
    border: 2px solid var(--primary); background: var(--card);
    color: var(--accent); font-size: 26px; cursor: pointer;
    z-index: 300; box-shadow: 0 0 30px var(--primary-glow);
    animation: pomoPulse 1.5s ease infinite, spin360 4s linear infinite;
    display: flex; align-items: center; justify-content: center;
  }
  .falling-star {
    position: fixed; font-size: 32px; cursor: pointer;
    color: var(--accent); z-index: 250; pointer-events: auto;
    filter: drop-shadow(0 0 12px var(--accent)); transition: transform .2s;
  }
  .falling-star:hover { transform: scale(1.3); }
  @keyframes fallDown {
    from { transform: translateY(-80px) rotate(0deg); opacity: 1; }
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(200%);
    background: var(--card); color: var(--text);
    padding: 14px 24px; border-radius: 12px;
    font-size: 15px; font-weight: 700;
    font-family: var(--font-head);
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    transition: transform .4s cubic-bezier(.34,1.56,.64,1);
    z-index: 1000; display: flex; align-items: center; gap: 10px;
    max-width: 90vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast i { color: var(--primary); font-size: 20px; }

  .ach-popup {
    position: fixed; top: 90px; right: 20px;
    background: var(--card); border: 2px solid var(--primary);
    border-radius: 16px; padding: 16px 20px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: var(--shadow-lg); z-index: 1500;
    animation: slideInRight .5s cubic-bezier(.34,1.56,.64,1);
    max-width: 340px;
  }
  @keyframes slideInRight { from { transform: translateX(150%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .ach-popup.out { animation: slideOutRight .4s ease forwards; }
  @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(150%); opacity: 0; } }
  .ach-popup .popup-icon {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0; animation: pop 1s ease infinite;
  }
  .ach-popup .popup-title { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .ach-popup .popup-name { font-family: var(--font-head); font-size: 17px; font-weight: 700; color: var(--primary); }

  .mem-card {
    aspect-ratio: 1; background: var(--bg-2); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; cursor: pointer; color: transparent;
    transition: all .3s; border: 2px solid var(--border); user-select: none;
  }
  .mem-card:hover { border-color: var(--primary); transform: scale(1.05); }
  .mem-card i { color: transparent; transition: color .3s, transform .3s; }
  .mem-card.flipped { background: rgba(16,185,129,.2); }
  .mem-card.flipped i { color: var(--primary); transform: scale(1.1); }
  .mem-card.matched { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); cursor: default; animation: pop .4s ease; }
  .mem-card.matched i { color: #fff; }

  .rps-btn { font-size: 32px; padding: 18px 22px; width: auto; margin: 0; color: var(--primary); }
  .rps-btn:hover { color: var(--accent); }

  /* SYNC STATUS */
  .sync-banner {
    position: fixed; top: 70px; left: 50%;
    transform: translateX(-50%) translateY(-200%);
    background: var(--card);
    border: 2px solid var(--primary);
    border-radius: 12px;
    padding: 10px 20px;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    box-shadow: var(--shadow-lg);
    display: flex; align-items: center; gap: 10px;
    z-index: 999;
    transition: transform .4s cubic-bezier(.34,1.56,.64,1);
    max-width: 90vw;
  }
  .sync-banner.show { transform: translateX(-50%) translateY(0); }
  .sync-banner i { color: var(--primary); font-size: 16px; }
  .sync-banner.syncing { border-color: var(--accent); }
  .sync-banner.syncing i { color: var(--accent); animation: spin360 1s linear infinite; }
  .sync-banner.offline { border-color: var(--danger); }
  .sync-banner.offline i { color: var(--danger); }
  .sync-banner.online { border-color: var(--success); }
  .sync-banner.online i { color: var(--success); }

  @media (max-width: 640px) {
    header { padding: 10px 14px; gap: 8px; }
    .logo { font-size: 22px; }
    .logo span { display: none; }
    .user-info { font-size: 14px; gap: 6px; }

    .profile-info { display: none; }
    .profile-chip { padding: 4px; }
    .profile-avatar { width: 34px; height: 34px; font-size: 16px; }
    .tabs { padding: 12px 16px 0; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 9px 13px; font-size: 13px; white-space: nowrap; }
    main { padding: 16px 16px 100px; }
    .section-head h2 { font-size: 22px; }
    .grid { grid-template-columns: 1fr; }
    .pomodoro { bottom: 16px; right: 16px; }
    #scroll-top { bottom: 16px; left: 16px; }
    .blob { display: none; }

    .honor-name { font-size: 16px; }
    .sync-banner { top: 60px; font-size: 12px; padding: 8px 14px; }
  }
</style>
</head>

function saveAllLocal() {

  localStorage.setItem(LS.schedule, JSON.stringify(state.schedule));
  localStorage.setItem(LS.homework, JSON.stringify(state.homework));
  localStorage.setItem(LS.questions, JSON.stringify(state.questions));
  localStorage.setItem(LS.reactions, JSON.stringify(state.reactions));
  localStorage.setItem(LS.poll, JSON.stringify(state.poll));
  localStorage.setItem(LS.chat, JSON.stringify(state.chat));
  localStorage.setItem(LS.pet, JSON.stringify(state.pet));
  localStorage.setItem(LS.honor, JSON.stringify(state.honor));
  if (state.doodle) localStorage.setItem(LS.doodle, state.doodle);
  else localStorage.removeItem(LS.doodle);
  if (state.current) localStorage.setItem(LS.current, state.current);
  else localStorage.removeItem(LS.current);
}

function saveAll() {
  // Сохраняем локально сразу
  saveAllLocal();

  // Отправляем в облако
  if (!cloudReady) return;
  const payload = {
    users: state.users,
    news: state.news,
    schedule: state.schedule,
    homework: state.homework,
    questions: state.questions,
    reactions: state.reactions,
    poll: state.poll,
    chat: state.chat,
    pet: state.pet,
    honor: state.honor,
    doodle: state.doodle || null,
    meta: { updatedAt: Date.now(), updatedBy: state.current }
  };
  isSyncing = true;
  updateSyncStatus();
  cloudRoot.set(payload).then(() => {
    isSyncing = false;
    lastCloudUpdate = Date.now();
    updateSyncStatus();
  }).catch(err => {
    isSyncing = false;
    console.error('Sync error:', err);
    updateSyncStatus('error');
  });
}

function saveUser() {
  localStorage.setItem(LS.users, JSON.stringify(state.users));
  if (!cloudReady) return;
  cloudRoot.child('users').set(state.users).catch(err => console.error(err));
}

function setSyncBanner(cls, icon, text, autohide) {
  const el = document.getElementById('sync-banner');
  const ic = el.querySelector('i');
  ic.className = 'fa-solid ' + icon;
  document.getElementById('sync-banner-text').textContent = text;
  el.className = 'sync-banner show ' + (cls || '');
  clearTimeout(setSyncBanner._t);
  if (autohide) {
    setSyncBanner._t = setTimeout(() => el.classList.remove('show'), autohide);
  }
}

function updateSyncStatus(errorType) {
  const btn = document.getElementById('sync-btn');
  if (!btn) return;
  if (errorType === 'error') {
    btn.className = 'icon-btn offline';
    btn.querySelector('i').className = 'fa-solid fa-cloud-exclamation';
    return;
  }
  if (isSyncing) {
    btn.className = 'icon-btn syncing';
    btn.querySelector('i').className = 'fa-solid fa-rotate';
  } else {
    btn.className = 'icon-btn online';
    btn.querySelector('i').className = 'fa-solid fa-cloud';
  }
}

function initCloudSync() {
  updateSyncStatus();
  cloudRoot.once('value').then(snap => {
    const data = snap.val();

    if (!data || !data.users || data.users.length === 0) {
      // Первый запуск — грузим локальные данные в облако
      cloudReady = true;
      saveAll();
      setSyncBanner('online', 'fa-cloud-arrow-up', 'Данные загружены в облако', 2500);
    } else {
      // Данные уже есть — берём их из облака
      applyCloudData(data, false);
      cloudReady = true;
      updateSyncStatus();
      setSyncBanner('online', 'fa-circle-check', 'Подключено к облаку', 2000);
    }

    // Подписка на все последующие изменения
    cloudRoot.on('value', snap2 => {
      const d = snap2.val();
      if (!d) return;
      // Игнорируем свои же апдейты (в течение 1 сек после отправки)
      if (Date.now() - lastCloudUpdate < 800) return;
      applyCloudData(d, true);
    });
  }).catch(err => {
    console.error('Firebase init error:', err);
    cloudReady = false;
    updateSyncStatus('error');
    setSyncBanner('offline', 'fa-triangle-exclamation', 'Нет связи. Работаем офлайн.', 4000);
  });

  // Индикатор онлайн/офлайн интернета
  firebase.database().ref('.info/connected').on('value', snap => {
    const connected = snap.val();
    if (connected) {
      cloudReady = true;
      updateSyncStatus();
    } else {
      cloudReady = false;
      updateSyncStatus('error');
    }
  });
}

function applyCloudData(data, isRemoteUpdate) {
  if (data.users) state.users = data.users;
  if (data.news) state.news = data.news;
  if (data.schedule) state.schedule = data.schedule;
  if (data.homework) state.homework = data.homework;
  if (data.questions) state.questions = data.questions;
  if (data.reactions) state.reactions = data.reactions;
  if (data.poll) state.poll = data.poll;
  if (data.chat) state.chat = data.chat;
  if (data.pet) state.pet = data.pet;
  if (data.honor) state.honor = data.honor;
  if (data.doodle !== undefined) state.doodle = data.doodle;

  saveAllLocal();

  const appVisible = document.getElementById('app') && document.getElementById('app').style.display !== 'none';
  if (!appVisible) return;

  // Сохраняем позицию в чате
  const chatInput = document.getElementById('chat-input');
  const chatValue = chatInput ? chatInput.value : '';
  const chatFocused = chatInput && document.activeElement === chatInput;
  const chatBox = document.getElementById('chat-messages');
  const chatAtBottom = chatBox ? (chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 60) : true;
  const chatScroll = chatBox ? chatBox.scrollTop : 0;

  // Перерисовываем всё
  renderAll();
  updateHeader();

  // Восстанавливаем чат
  const newChatInput = document.getElementById('chat-input');
  if (newChatInput) {
    if (chatFocused) {
      newChatInput.value = chatValue;
      newChatInput.focus();
      try { newChatInput.setSelectionRange(chatValue.length, chatValue.length); } catch(e){}
    }
  }
  const newChatBox = document.getElementById('chat-messages');
  if (newChatBox) {
    if (chatAtBottom) newChatBox.scrollTop = newChatBox.scrollHeight;
    else newChatBox.scrollTop = chatScroll;
  }

  // Показываем индикатор новых сообщений, если вкладка чата не активна
  if (isRemoteUpdate && data.chat && data.chat.length > 0) {
    const activeTab = document.querySelector('.tab.active');
    if (!activeTab || activeTab.dataset.tab !== 'chat') {
      const chatTab = document.querySelector('[data-tab="chat"]');
      if (chatTab) chatTab.classList.add('has-new');
    }
  }

  if (isRemoteUpdate) {
    setSyncBanner('online', 'fa-cloud-arrow-down', 'Обновлено', 1500);
  }
}

/* ============================================================
   XP & УРОВНИ
   ============================================================ */
function getLevel(xp) {
  let lvl = 1, need = 100;
  let rest = xp;
  while (rest >= need && lvl < MAX_LEVEL) { rest -= need; lvl++; need = 100 + (lvl - 1) * 50; }
  if (lvl >= MAX_LEVEL) return { level: MAX_LEVEL, current: 0, need: 1, max: true };
  return { level: lvl, current: rest, need };
}
function addXP(amount) {
  const u = currentUser();
  if (!u) return;
  if (u.isAdmin) { u.xp = ADMIN_XP; saveUser(); updateHeader(); return; }
  const before = getLevel(u.xp).level;
  u.xp += amount;
  const after = getLevel(u.xp).level;
  saveUser(); updateHeader();
  if (after > before) {
    toast(`Уровень ${after}! Поздравляю!`, 'fa-arrow-up');
    confetti();
  }
  checkAchievements();
}
function updateHeader() {
  const u = currentUser();
  if (!u) return;
  const lv = getLevel(u.xp);
  document.getElementById('user-name').textContent = u.name;
  const av = document.getElementById('user-avatar');
  av.innerHTML = `<i class="fa-solid ${u.avatar || 'fa-user'}"></i>`;
  av.className = 'profile-avatar' + (u.isAdmin ? ' owner' : '');
  document.getElementById('user-level').innerHTML = u.isAdmin
    ? '<i class="fa-solid fa-crown" style="color:var(--gold-2)"></i> Владелец'
    : 'Ур. ' + lv.level;
  document.getElementById('user-xp-bar').style.width = (lv.current / lv.need * 100) + '%';
  document.getElementById('menu-level').textContent = u.isAdmin ? 'MAX' : lv.level;
  document.getElementById('menu-xp').textContent = u.isAdmin ? '∞ / ∞' : (lv.current + ' / ' + lv.need);
  document.getElementById('menu-ach').textContent = u.achievements.length + '/' + ACHIEVEMENTS.length;
  document.getElementById('menu-clicks').textContent = u.stats.clicks || 0;
  document.getElementById('menu-msgs').textContent = u.stats.msgs || 0;
}

  if ((u.stats.msgs || 0) >= 10) unlockAchievement('chat_10');

  if ((u.stats.reactions || 0) >= 10) unlockAchievement('reaction_giver');
  if ((u.stats.funOpens || 0) >= 5) unlockAchievement('fun_clicked');
  if (state.pet.feedCount >= 5) unlockAchievement('pet_fed');
  if (state.pet.patCount >= 10) unlockAchievement('pet_love');
}

/* ============================================================
   IMAGE RESIZE
   ============================================================ */
function resizeImage(file, maxSize = 320) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
        else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderNickWithBadges(nick, opts = {}) {
  const u = userByNick(nick);
  if (!u) return escapeHtml(nick);
  const lv = getLevel(u.xp);
  const prefix = u.isAdmin
    ? '<span class="owner-prefix"><i class="fa-solid fa-crown"></i> Владелец</span>'

  const level = u.isAdmin
    ? '<span class="msg-level"><i class="fa-solid fa-infinity"></i> MAX</span>'
    : `<span class="msg-level"><i class="fa-solid fa-star"></i> ${lv.level}</span>`;
  const showLevel = opts.showLevel !== false;
  return `${prefix}<span>${escapeHtml(nick)}</span>${showLevel ? level : ''}`;
}

function register() {
  const name = document.getElementById('reg-name').value.trim();
  const nick = document.getElementById('reg-nick').value.trim();
  const pass = document.getElementById('reg-pass').value;
  const err = document.getElementById('reg-error');
  err.textContent = '';
  if (!name) return err.textContent = 'Введите имя';
  if (name.length < 2) return err.textContent = 'Имя слишком короткое';
  if (!nick) return err.textContent = 'Введите ник';
  if (nick.length < 3) return err.textContent = 'Ник минимум 3 символа';
  if (!pass) return err.textContent = 'Придумайте пароль';
  if (pass.length < 4) return err.textContent = 'Пароль минимум 4 символа';
  if (state.users.find(u => u.nick.toLowerCase() === nick.toLowerCase()))
    return err.textContent = 'Этот ник уже занят';

  // Проверка свежести данных из облака (на всякий случай)
  const finish = () => {
    if (state.users.find(u => u.nick.toLowerCase() === nick.toLowerCase()))
      return err.textContent = 'Этот ник только что заняли. Попробуй другой';
    state.users.push({
      name, nick, password: pass, isAdmin: false,
      avatar: state.regAvatar, xp: 0, achievements: [],
      stats: { clicks: 0, msgs: 0, reactions: 0, funOpens: 0 }
    });
    state.current = nick;
    saveAll();
    toast('Аккаунт создан! Привет, ' + name + '!', 'fa-circle-check');
    enterApp();
    setTimeout(() => unlockAchievement('first_login'), 800);
  };

  if (cloudReady) {
    cloudRoot.child('users').once('value').then(snap => {
      const users = snap.val() || [];
      if (users.find(u => u.nick.toLowerCase() === nick.toLowerCase())) {
        return err.textContent = 'Этот ник уже занят';
      }
      finish();
    }).catch(finish);
  } else {
    finish();
  }
}
function login() {
  const nick = document.getElementById('log-nick').value.trim();
  const pass = document.getElementById('log-pass').value;
  const err = document.getElementById('log-error');
  err.textContent = '';

  const attempt = (users) => {
    const user = users.find(u => u.nick.toLowerCase() === nick.toLowerCase());
    if (!user) return err.textContent = 'Пользователь не найден';
    if (user.password !== pass) return err.textContent = 'Неверный пароль';
    state.users = users;
    state.current = user.nick;
    saveAllLocal();
    toast('С возвращением, ' + user.name + '!', 'fa-hand-wave');
    enterApp();
  };

  if (cloudReady) {
    cloudRoot.child('users').once('value').then(snap => {
      const users = snap.val();
      if (users && users.length) attempt(users);
      else attempt(state.users);
    }).catch(() => attempt(state.users));
  } else {
    attempt(state.users);
  }
}

  state.current = null;

  const arr = state.reactions[newsId][type];

  else {

    if (u) { u.stats.reactions = (u.stats.reactions || 0) + 1; saveUser(); }

function renderPoll() {
  const el = document.getElementById('poll-widget');
  if (!el) return;
  const me = state.current;
  const total = state.poll.options.reduce((s, o) => s + o.votes.length, 0);
  const voted = state.poll.options.some(o => o.votes.includes(me));
  let html = `<div style="font-weight:700;margin-bottom:10px;font-size:14px;font-family:var(--font-head)">${escapeHtml(state.poll.question)}</div>`;
  state.poll.options.forEach(o => {
    const count = o.votes.length;
    const pct = total > 0 ? (count / total * 100) : 0;
    const isVoted = o.votes.includes(me);
    html += `
      <div class="poll-option ${voted ? 'voted' : ''} ${isVoted ? 'voted' : ''}" onclick="votePoll('${o.id}')">
        ${voted ? `<div class="poll-fill" style="width:${pct}%"></div>` : ''}
        <span class="poll-label">${isVoted ? '<i class="fa-solid fa-check"></i> ' : ''}${escapeHtml(o.text)}</span>
        ${voted ? `<span class="poll-count">${count} • ${Math.round(pct)}%</span>` : ''}
      </div>
    `;
  });
  if (voted) html += `<div style="text-align:center;font-size:12px;color:var(--muted);margin-top:8px">Всего голосов: ${total}</div>`;
  el.innerHTML = html;

function votePoll(optId) {
  const me = state.current;
  const opt = state.poll.options.find(o => o.id === optId);
  if (!opt || opt.votes.includes(me)) return;
  state.poll.options.forEach(o => {
    const i = o.votes.indexOf(me);
    if (i >= 0) o.votes.splice(i, 1);
  });
  opt.votes.push(me);
  saveAll(); renderPoll();
  addXP(5);
  unlockAchievement('poll_voter');
  toast('Голос учтён!', 'fa-check');
}

      <button type="button" class="btn btn-small" id="honor-photo-clear" style="display:none;color:var(--danger);border-color:var(--danger)">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="honor-photo-preview" id="honor-photo-preview">
      <img id="honor-photo-img" alt="">
      <p style="font-size:12px;color:var(--muted);margin-top:8px">Предпросмотр · <span id="honor-photo-size"></span></p>
    </div>
  `, () => {
    const nick = document.getElementById('honor-nick').value.trim();
    const reason = document.getElementById('honor-reason').value.trim();
    if (!nick) { toast('Введите ник', 'fa-triangle-exclamation'); return false; }
    if (!reason) { toast('Введите причину', 'fa-triangle-exclamation'); return false; }
    const u = userByNick(nick);
    if (!u) { toast('Пользователь с таким ником не найден', 'fa-triangle-exclamation'); return false; }
    if (state.honor.some(h => h.nick === u.nick)) { toast('Этот ученик уже на доске', 'fa-triangle-exclamation'); return false; }

    const item = {
      id: Date.now(),
      nick: u.nick,
      name: u.name,
      reason,
      date: formatDate(new Date())
    };
    if (photoData) item.photo = photoData;

    try {
      state.honor.push(item);
      if (!u.achievements.includes('honor_member')) u.achievements.push('honor_member');
      if (u.nick === state.current) updateHeader();
      saveAll();
      renderHonor();
      toast(`${u.name} на доске почёта!`, 'fa-award');
      confetti();
    } catch (e) {
      toast('Ошибка сохранения. Попробуй фото поменьше', 'fa-triangle-exclamation');
      return false;
    }
    return true;
  });

  setTimeout(() => {
    const fileInput = document.getElementById('honor-photo');
    const preview = document.getElementById('honor-photo-preview');
    const previewImg = document.getElementById('honor-photo-img');
    const clearBtn = document.getElementById('honor-photo-clear');
    const sizeLabel = document.getElementById('honor-photo-size');

    fileInput.addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        toast('Это не изображение', 'fa-triangle-exclamation');
        return;
      }
      if (file.size > 8 * 1024 * 1024) {
        toast('Файл больше 8 МБ', 'fa-triangle-exclamation');
        return;
      }
      try {
        photoData = await resizeImage(file, 320);
        previewImg.src = photoData;
        preview.style.display = 'block';
        clearBtn.style.display = 'inline-flex';
        const kb = Math.round(photoData.length * 0.75 / 1024);
        sizeLabel.textContent = '~' + kb + ' КБ';
      } catch (err) {
        toast('Не удалось загрузить фото', 'fa-triangle-exclamation');
      }
    });

    clearBtn.addEventListener('click', () => {
      photoData = null;
      fileInput.value = '';
      preview.style.display = 'none';
      clearBtn.style.display = 'none';
    });
  }, 60);
}

function playReaction() {
  openModal('<i class="fa-solid fa-bolt"></i> Тест реакции', `

  `, null, { hideSave: true });
  const area = document.getElementById('react-area');
  const result = document.getElementById('react-result');
  let st = 'idle', start, timer;
  area.onclick = () => {
    if (st === 'idle' || st === 'done') {
      st = 'wait'; area.style.background = 'linear-gradient(135deg, #fbbf24, #f59e0b)'; area.style.color = '#78350f';
      area.innerHTML = '<i class="fa-solid fa-hourglass-half fa-spin"></i> Жди зелёного...';
      result.textContent = '';
      timer = setTimeout(() => {
        st = 'go'; area.style.background = 'linear-gradient(135deg, var(--primary), var(--primary-dark))'; area.style.color = '#fff';
        area.innerHTML = '<i class="fa-solid fa-hand-pointer"></i> ЖМИ!';
        start = performance.now();
      }, 1200 + Math.random() * 3000);
    } else if (st === 'wait') {
      clearTimeout(timer); st = 'idle';
      area.style.background = 'var(--bg-2)'; area.style.color = 'var(--muted)';
      area.innerHTML = '<i class="fa-solid fa-hand-pointer"></i> Рано! Ещё раз';
      result.textContent = 'Рано!';
    } else if (st === 'go') {
      const t = Math.round(performance.now() - start);
      st = 'done';
      area.style.background = 'var(--bg-2)'; area.style.color = 'var(--primary)';
      area.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Нажми ещё';
      let grade, ic;
      if (t < 200) { grade = 'Космос!'; ic = 'fa-rocket'; }
      else if (t < 300) { grade = 'Отлично!'; ic = 'fa-bolt'; }
      else if (t < 450) { grade = 'Хорошо'; ic = 'fa-thumbs-up'; }

      result.innerHTML = `<i class="fa-solid ${ic}"></i> ${t} мс — ${grade}`;
      if (t < 250) { confetti(); addXP(15); }
      else addXP(3);
    }
  };

function playMemory() {
  const icons = ['fa-clover','fa-gamepad','fa-bullseye','fa-trophy','fa-star','fa-gift','fa-palette','fa-heart'];
  const cards = [...icons, ...icons].sort(() => Math.random() - 0.5);
  let flipped = [], matched = 0, moves = 0, locked = false;
  let html = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">';
  cards.forEach((ic, i) => html += `<div class="mem-card" data-i="${i}" data-ic="${ic}"><i class="fa-solid ${ic}"></i></div>`);
  html += '</div><p style="text-align:center;margin-top:14px;font-family:var(--font-head)">Ходы: <b id="mem-moves">0</b> • Пары: <b id="mem-pairs">0</b>/8</p>';
  openModal('<i class="fa-solid fa-brain"></i> Память', html, null, { hideSave: true });
  document.querySelectorAll('.mem-card').forEach(card => {
    card.onclick = () => {
      if (locked || card.classList.contains('matched') || card.classList.contains('flipped')) return;
      card.classList.add('flipped');
      flipped.push(card);
      if (flipped.length === 2) {
        moves++;
        document.getElementById('mem-moves').textContent = moves;
        locked = true;
        if (flipped[0].dataset.ic === flipped[1].dataset.ic) {
          setTimeout(() => {
            flipped.forEach(c => { c.classList.add('matched'); c.classList.remove('flipped'); });
            flipped = []; matched++; locked = false;
            document.getElementById('mem-pairs').textContent = matched;
            if (matched === 8) {
              toast(`Победа за ${moves} ходов!`, 'fa-trophy');
              confetti(); addXP(30);
            }
          }, 400);
        } else {
          setTimeout(() => {
            flipped.forEach(c => c.classList.remove('flipped'));
            flipped = []; locked = false;
          }, 750);
        }
      }
    };
  });
}

function playGuess() {
  const secret = Math.floor(Math.random() * 100) + 1;
  let tries = 0;
  const maxTries = 7;
  openModal('<i class="fa-solid fa-dice"></i> Угадай число', `
    <p style="text-align:center;margin-bottom:14px;color:var(--muted);font-family:var(--font-head)">
      <i class="fa-solid fa-lightbulb" style="color:var(--accent)"></i> Загадал число от 1 до 100
    </p>
    <input type="number" id="guess-input" placeholder="?" min="1" max="100" style="text-align:center;font-size:32px;font-weight:800;padding:18px;font-family:var(--font-head)">
    <div id="guess-msg" style="text-align:center;margin-top:14px;font-size:22px;font-weight:700;min-height:34px;font-family:var(--font-head)"></div>
    <p style="text-align:center;color:var(--muted);font-size:15px;font-family:var(--font-head)">Попыток: <b id="guess-tries">0</b> / ${maxTries}</p>
    <button class="btn btn-primary" style="width:100%;margin-top:12px" id="guess-submit-btn">
      <i class="fa-solid fa-check"></i> Проверить
    </button>
  `, null, { hideSave: true });
  const input = document.getElementById('guess-input');
  const msg = document.getElementById('guess-msg');
  const triesEl = document.getElementById('guess-tries');
  const submitBtn = document.getElementById('guess-submit-btn');
  function check() {
    const v = parseInt(input.value);
    if (!v || v < 1 || v > 100) { msg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Введи 1–100'; return; }
    tries++; triesEl.textContent = tries;
    if (v === secret) {
      msg.innerHTML = `<i class="fa-solid fa-trophy" style="color:var(--primary)"></i> Угадал! Это ${secret}`;
      msg.style.color = 'var(--primary)';
      input.disabled = true; submitBtn.disabled = true; submitBtn.style.opacity = '.5';
      confetti(); toast('Победа за ' + tries + ' попыток!', 'fa-trophy'); addXP(25);
      return;
    }
    if (tries >= maxTries) {
      msg.innerHTML = `<i class="fa-solid fa-face-sad-tear" style="color:var(--danger)"></i> Было ${secret}`;
      msg.style.color = 'var(--danger)';
      input.disabled = true; submitBtn.disabled = true; submitBtn.style.opacity = '.5';
      return;
    }
    if (v < secret) {
      const diff = secret - v;
      msg.innerHTML = `<i class="fa-solid fa-arrow-up" style="color:#3b82f6"></i> Больше${diff <= 10 ? ' (горячо!)' : ''}`;
      msg.style.color = '#3b82f6';
    } else {
      const diff = v - secret;
      msg.innerHTML = `<i class="fa-solid fa-arrow-down" style="color:var(--accent)"></i> Меньше${diff <= 10 ? ' (горячо!)' : ''}`;
      msg.style.color = 'var(--accent)';
    }
    msg.style.animation = 'pop .3s ease';
    setTimeout(() => msg.style.animation = '', 300);
    input.value = ''; input.focus();
  }
  submitBtn.onclick = check;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  setTimeout(() => input.focus(), 100);
}

function playRPSRound(player) {
  const opts = ['камень','бумага','ножницы'];
  const icons = { камень:'fa-hand-back-fist', бумага:'fa-hand', ножницы:'fa-hand-scissors' };
  const computer = opts[Math.floor(Math.random()*3)];
  const cEl = document.getElementById('rps-computer');
  let spins = 0;
  const spin = setInterval(() => {
    cEl.innerHTML = `<i class="fa-solid ${icons[opts[Math.floor(Math.random()*3)]]}"></i>`;
    if (++spins > 8) {
      clearInterval(spin);
      cEl.innerHTML = `<i class="fa-solid ${icons[computer]}"></i>`;
      cEl.style.animation = 'pop .4s ease';
      setTimeout(() => cEl.style.animation = '', 400);
      const result = document.getElementById('rps-result');
      if (player === computer) {
        result.innerHTML = '<i class="fa-solid fa-handshake" style="color:var(--accent)"></i> Ничья!';
      } else if (
        (player === 'камень' && computer === 'ножницы') ||
        (player === 'бумага' && computer === 'камень') ||
        (player === 'ножницы' && computer === 'бумага')
      ) {
        result.innerHTML = '<i class="fa-solid fa-trophy" style="color:var(--primary)"></i> Ты победил!';
        window._rpsWin++; addXP(5);
      } else {
        result.innerHTML = '<i class="fa-solid fa-face-sad-tear" style="color:var(--danger)"></i> Ты проиграл';
        window._rpsLose++;
      }
      document.getElementById('rps-score').textContent = window._rpsWin + ' : ' + window._rpsLose;
    }
  }, 100);
}

  const all = [...easy, ...medium, ...hard, ...veryHard, ...funny];
  let started = false, currentWord, score = 0, timeLeft = 60, timer;
  let usedWords = [];
  function pickWord() {
    let pool = all.filter(w => !usedWords.includes(w));
    if (pool.length === 0) { usedWords = []; pool = all; }
    const weighted = [];
    pool.forEach(w => {
      const weight = w.length > 12 ? 5 : w.length > 10 ? 3 : w.length > 7 ? 2 : 1;
      for (let i = 0; i < weight; i++) weighted.push(w);
    });
    const word = weighted[Math.floor(Math.random() * weighted.length)];
    usedWords.push(word);
    if (usedWords.length > 15) usedWords.shift();
    return word;
  }
  openModal('<i class="fa-solid fa-keyboard"></i> Печатай быстро', `
    <p style="text-align:center;color:var(--muted);margin-bottom:8px;font-family:var(--font-head)">
      <i class="fa-solid fa-clock" style="color:var(--accent)"></i> 60 секунд — печатай слова!
    </p>
    <div id="type-word" style="font-size:34px;font-weight:700;text-align:center;color:var(--primary);padding:22px;letter-spacing:3px;font-family:var(--font-head);min-height:90px;display:flex;align-items:center;justify-content:center;transition:transform .15s;word-break:break-word">
      <i class="fa-solid fa-rocket"></i> готов?
    </div>
    <input id="type-input" placeholder="Начни печатать..." style="text-align:center;font-size:20px;font-family:var(--font-head)">
    <p style="text-align:center;margin-top:12px;font-family:var(--font-head);font-size:16px">
      <i class="fa-solid fa-check" style="color:var(--primary)"></i> Счёт: <b id="type-score">0</b>
      &nbsp;•&nbsp;
      <i class="fa-solid fa-hourglass-half" style="color:var(--accent)"></i> Время: <b id="type-time">60</b>с
    </p>
  `, null, { hideSave: true });
  const input = document.getElementById('type-input');
  const wordEl = document.getElementById('type-word');
  const scoreEl = document.getElementById('type-score');
  const timeEl = document.getElementById('type-time');
  function nextWord() {
    currentWord = pickWord();
    wordEl.textContent = currentWord;
    wordEl.style.transform = 'scale(.85)';
    wordEl.style.color = 'var(--primary)';
    setTimeout(() => wordEl.style.transform = 'scale(1)', 100);
  }
  input.addEventListener('input', () => {
    if (!started) {
      started = true; nextWord();
      timer = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          input.disabled = true;
          wordEl.textContent = 'Финиш!';
          wordEl.style.color = 'var(--accent)';
          toast('Результат: ' + score + ' слов', 'fa-flag-checkered');
          addXP(Math.min(50, score * 2));
          if (score >= 15) confetti();
        }
      }, 1000);
    }
    if (input.value.trim().toLowerCase() === currentWord) {
      score++; scoreEl.textContent = score;
      wordEl.style.color = 'var(--accent)';
      wordEl.style.transform = 'scale(1.15)';
      setTimeout(() => { wordEl.style.color = 'var(--primary)'; }, 200);
      input.value = ''; nextWord();
    }
  });
  setTimeout(() => input.focus(), 100);
}
