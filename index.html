let doodleInit = false;
let doodleSaveTimer = null;
function initDoodle() {
  const el = document.getElementById('tab-doodle');
  el.innerHTML = `
    <div class="section-head">
      <h2><i class="fa-solid fa-palette"></i> Дудлы класса</h2>
      <span style="color:var(--muted);font-size:14px"><i class="fa-solid fa-paintbrush"></i> Рисуй вместе!</span>
    </div>

      <div class="doodle-tools">
        <button class="color-btn active" style="background:#059669" data-color="#059669"></button>
        <button class="color-btn" style="background:#f59e0b" data-color="#f59e0b"></button>
        <button class="color-btn" style="background:#8b5cf6" data-color="#8b5cf6"></button>
        <button class="color-btn" style="background:#ec4899" data-color="#ec4899"></button>
        <button class="color-btn" style="background:#3b82f6" data-color="#3b82f6"></button>
        <button class="color-btn" style="background:#ef4444" data-color="#ef4444"></button>
        <button class="color-btn" style="background:#0f172a" data-color="#0f172a"></button>
        <input type="range" id="doodle-size" min="1" max="30" value="4">
        <button class="btn btn-small" onclick="doodleClear()"><i class="fa-solid fa-eraser"></i> Очистить</button>
        <button class="btn btn-small" onclick="doodleSave()"><i class="fa-solid fa-floppy-disk"></i> В архив</button>
      </div>
      <canvas id="doodle-canvas"></canvas>
      <p style="text-align:center;color:var(--muted);font-size:13px;margin-top:10px"><i class="fa-solid fa-lightbulb"></i> Рисунок сохраняется автоматически в облако</p>
    </div>
  `;
  const canvas = document.getElementById('doodle-canvas');
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = 400;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#059669'; ctx.lineWidth = 4;
  if (state.doodle) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0);
    img.src = state.doodle;
  }
  let drawing = false, lastX = 0, lastY = 0;
  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: x * (canvas.width / r.width), y: y * (canvas.height / r.height) };
  }
  function start(e) { e.preventDefault(); drawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(lastX + 0.01, lastY + 0.01); ctx.stroke(); }
  function move(e) { if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke(); lastX = p.x; lastY = p.y; }
  function end() { if (!drawing) return; drawing = false; scheduleDoodleSave(); }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
  document.querySelectorAll('.doodle-tools .color-btn').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.doodle-tools .color-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active'); ctx.strokeStyle = b.dataset.color;
    };
  });
  document.getElementById('doodle-size').oninput = e => { ctx.lineWidth = parseInt(e.target.value); };
  doodleInit = true;
}
function scheduleDoodleSave() {
  clearTimeout(doodleSaveTimer);
  doodleSaveTimer = setTimeout(() => {
    saveDoodleAuto();
  }, 1500); // Сохраняем через 1.5 сек после последнего штриха
}
function saveDoodleAuto() {
  const c = document.getElementById('doodle-canvas');
  if (!c) return;
  state.doodle = c.toDataURL('image/jpeg', 0.6);
  saveAll();
  const u = currentUser();
  if (u && !u.achievements.includes('artist')) { unlockAchievement('artist'); addXP(5); }
}
function doodleClear() {

function renderAchievements() {
  const el = document.getElementById('tab-achievements');
  const u = currentUser();
  const unlocked = u ? u.achievements : [];
  const pct = Math.round(unlocked.length / ACHIEVEMENTS.length * 100);
  let html = `
    <div class="section-head">
      <h2><i class="fa-solid fa-trophy"></i> Достижения</h2>
      <span style="color:var(--muted);font-size:14px;font-family:var(--font-head)">
        <i class="fa-solid fa-star"></i> ${unlocked.length} / ${ACHIEVEMENTS.length} (${pct}%)
      </span>
    </div>
    <div class="ach-grid">
  `;
  ACHIEVEMENTS.forEach(a => {
    const has = unlocked.includes(a.id);
    html += `
      <div class="ach-card ${has ? 'unlocked' : 'locked'}">
        <div class="ach-icon"><i class="fa-solid ${a.icon}"></i></div>
        <div class="ach-info">
          <h4>${a.name}</h4>
          <p>${a.desc}</p>
        </div>
      </div>
    `;
  });
  html += '</div>';
  el.innerHTML = html;
}

let modalSaveHandler = null;
function openModal(title, bodyHtml, onSave, opts = {}) {
  document.getElementById('modal-title').innerHTML = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  const saveBtn = document.getElementById('modal-save');
  const actions = document.getElementById('modal-actions');
  if (opts.hideSave) {
    saveBtn.style.display = 'none';
    actions.style.display = 'none';
  } else {
    saveBtn.style.display = 'inline-flex';
    actions.style.display = 'flex';
  }
  document.getElementById('modal').classList.add('open');
  modalSaveHandler = () => {
    const ok = onSave ? onSave() : true;
    if (ok !== false) closeModal();
  };
  saveBtn.onclick = modalSaveHandler;
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  modalSaveHandler = null;
}
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

let pomoInterval = null, pomoTimeLeft = 25*60, pomoRunning = false, pomoMode = 'work';
document.getElementById('pomodoro-toggle').onclick = () => {
  document.getElementById('pomodoro-panel').classList.toggle('open');
};
function updatePomoDisplay() {
  const m = Math.floor(pomoTimeLeft/60), s = pomoTimeLeft%60;
  document.getElementById('pomo-time').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function pomoStart() {
  if (pomoRunning) return;
  pomoRunning = true;
  pomoInterval = setInterval(() => {
    pomoTimeLeft--;
    updatePomoDisplay();
    if (pomoTimeLeft <= 0) {
      clearInterval(pomoInterval); pomoRunning = false;
      confetti();
      toast(pomoMode === 'work' ? 'Работа окончена!' : 'Отдых закончен!', 'fa-bell');
      if (pomoMode === 'work') { pomoMode = 'break'; pomoTimeLeft = 5*60; }
      else { pomoMode = 'work'; pomoTimeLeft = 25*60; }
      updatePomoDisplay();
    }
  }, 1000);
}
function pomoPause() { clearInterval(pomoInterval); pomoRunning = false; }
function pomoReset() {
  clearInterval(pomoInterval); pomoRunning = false;
  pomoMode = 'work'; pomoTimeLeft = 25*60; updatePomoDisplay();
}
updatePomoDisplay();

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function formatDate(d) { return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0'); }
function formatDateTime(d) { return formatDate(d) + ' ' + formatTime(d); }
function formatTime(d) { return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function toast(text, icon) {
  const t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  t.querySelector('i').className = 'fa-solid ' + (icon || 'fa-circle-info');
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
